<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="greenArm" gradientUnits="userSpaceOnUse" x1="100" y1="144" x2="142" y2="56">
      <stop offset="0" stop-color="#14612F"/>
      <stop offset="1" stop-color="#2FB864"/>
    </linearGradient>
  </defs>

  <!-- Subtle Surface Container -->
  <rect x="16" y="16" width="168" height="168" rx="42" fill="#F6F8F6"/>

  <!-- Minimalist Geometric "V" -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Arm: Deep Carbon -->
    <path d="M58 56 L100 144" stroke="#111613" stroke-width="20"/>

    <!-- Right Arm: Forest Green gradient -->
    <path d="M100 144 L142 56" stroke="url(#greenArm)" stroke-width="20"/>
  </g>

  <!-- Accent dot -->
  <circle cx="162" cy="42" r="6" fill="#6EE7A1"/>
</svg>
