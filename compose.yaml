services:
  vandor-web:
    image: tomcat:11.0
    ports:
      - "8080:8080"
    volumes:
      - ./deploy:/usr/local/tomcat/webapps
    depends_on:
      - vandor-db

  vandor-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vandor_db
      POSTGRES_USER: vandor
      POSTGRES_PASSWORD: vandorpw
    volumes:
      - vandor-pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

volumes:
  vandor-pgdata:
