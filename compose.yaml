services:
  vandor-web:
    image: tomcat:11.0
    ports:
      - "8080:8080"
    volumes:
      - ./deploy:/usr/local/tomcat/webapps:Z
      - vandor-uploads:/var/lib/vandor/uploads
    environment:
      DB_URL: jdbc:postgresql://vandor-db:5432/vandor_db
      DB_USER: vandor
      DB_PASSWORD: vandorpw
      UPLOAD_DIR: /var/lib/vandor/uploads
    depends_on:
      - vandor-db

  vandor-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vandor_db
      POSTGRES_USER: vandor
      POSTGRES_PASSWORD: vandorpw
    volumes:
      - vandor-pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
    ports:
      - "5432:5432"

volumes:
  vandor-pgdata:
  vandor-uploads:
