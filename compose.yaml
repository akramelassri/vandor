services:
  vandor-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vandor_db
      POSTGRES_USER: vandor
      POSTGRES_PASSWORD: vandorpw
    volumes:
      - vandor-pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

volumes:
  vandor-pgdata:
